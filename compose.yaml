services:
  api:
    build: .
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - transit-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  transit-data:
